
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 캐릭터 프롬프트 생성기 v2.0</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --badge-bg: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1280px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card h2 {
            font-size: 1rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 0.45rem 0.6rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        /* 조건 1: 레퍼런스 사진 & 나이 설정 박스 */
        .photo-age-box {
            background-color: rgba(56, 189, 248, 0.08);
            border: 1px dashed var(--accent-color);
            padding: 0.75rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .photo-check-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .photo-check-row label {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .photo-check-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .age-inline-group {
            display: flex;
            gap: 0.4rem;
            align-items: center;
        }

        /* 악세사리 체크박스 + 콤보박스 그리드 */
        .acc-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.4rem;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 0.6rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .acc-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .acc-item label {
            min-width: 70px;
            font-size: 0.8rem;
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            margin: 0;
        }

        .acc-item input[type="checkbox"] {
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .acc-item select {
            flex: 1;
            padding: 0.25rem 0.4rem;
            font-size: 0.78rem;
        }

        .acc-item select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* MBTI 그리드 */
        .mbti-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.35rem;
        }

        .mbti-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 0.4rem 0.1rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }

        .mbti-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .mbti-btn.active {
            background-color: var(--accent-color);
            color: #0f172a;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }

        .mbti-desc {
            font-size: 0.75rem;
            color: var(--accent-color);
            min-height: 2em;
            line-height: 1.3;
        }

        .output-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
            margin-top: 1rem;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .output-header h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #e2e8f0;
            padding: 0.8rem;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.88rem;
            line-height: 1.4;
            resize: vertical;
            outline: none;
        }

        .btn-copy {
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        .recommend-badge {
            background-color: var(--badge-bg);
            color: var(--accent-color);
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-top: 0.2rem;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎨 AI 캐릭터 프롬프트 빌더 v2.0</h1>
        <p>화풍, 성별, 나이, 복장, 악세사리, 표정/포즈, 구도 및 품질까지 완벽 조합</p>
    </header>

    <div class="main-grid">
        <!-- 1. 스타일 & 기본 프로필 -->
        <div class="card">
            <h2>1. 스타일 & 프로필</h2>
            
            <!-- 조건 1: 레퍼런스 체크 + 나이 설정 (콤보박스 + 직접입력) -->
            <div class="photo-age-box">
                <div class="photo-check-row">
                    <label>
                        <input type="checkbox" id="usePhoto" onchange="generatePrompt()"> 📸 레퍼런스 사진(얼굴) 추가
                    </label>
                </div>
                <div class="form-group">
                    <label>나이 (Age Group)</label>
                    <div class="age-inline-group">
                        <select id="ageGroup" onchange="handleAgeChange()">
                            <option value="teenager student in 10s">10대 (Teenager)</option>
                            <option value="young adult in 20s" selected>20대 (Young Adult)</option>
                            <option value="adult in 30s">30대 (Adult)</option>
                            <option value="young forty in 40s">40대 (Young Forty)</option>
                            <option value="senior in 50s">50대 (Senior)</option>
                            <option value="Custom">직접 입력</option>
                        </select>
                    </div>
                    <input type="text" id="customAge" placeholder="예: 60s elder with graceful posture" style="display:none; margin-top:0.3rem;" oninput="generatePrompt()">
                </div>
            </div>

            <!-- 조건 2: 화풍 스타일 10가지 세분화 -->
            <div class="form-group">
                <label>아트 스타일 (10가지 세분화)</label>
                <select id="artStyle" onchange="generatePrompt()">
                    <option value="Maplestory game style, cute 2D pixel art character, side-scroller sprite art style">🍁 메이플스토리 도트/픽셀 스타일</option>
                    <option value="Cute Chibi-style 3D digital illustration, smooth clay render">🧸 3D 치비 스타일 (Chibi 3D)</option>
                    <option value="2D Japanese anime style, clean lineart, vibrant anime key visual">🎨 2D 셀채색 애니메이션 (Japanese Anime)</option>
                    <option value="Retro 8-bit pixel art style, nostalgic arcade video game sprite">👾 레트로 8비트/16비트 픽셀 아트</option>
                    <option value="Realistic 3D cinematic render, photorealistic lighting, Unreal Engine 5 render">🎬 실사풍 3D 시네마틱 (Cinematic 3D)</option>
                    <option value="American comic book style, bold ink lines, pop-art halftone dots">💥 아메리칸 코믹북 (Comic Book Style)</option>
                    <option value="Soft watercolor illustration, delicate brush strokes, pastel color aesthetic">🖌️ 수채화 일러스트 (Watercolor)</option>
                    <option value="Cyberpunk synthwave style, glowing neon aesthetics, dark futuristic backdrop">🏙️ 사이버펑크 네온 (Cyberpunk Synthwave)</option>
                    <option value="Fantasy oil painting concept art, rich textures, dramatic lighting">🏰 판타지 유화 컨셉아트 (Oil Painting)</option>
                    <option value="Vector flat design illustration, minimalist clean edges, modern graphic art">📐 벡터 플랫 일러스트 (Flat Vector)</option>
                </select>
            </div>

            <div class="form-group">
                <label>성별 (Gender)</label>
                <select id="gender" onchange="handleGenderChange()">
                    <option value="female" selected>여성 (Female)</option>
                    <option value="male">남성 (Male)</option>
                    <option value="gender-neutral">중성적 (Gender-neutral)</option>
                </select>
            </div>

            <div class="form-group" id="faceBaseGroup">
                <label>얼굴/특징 모델 (사진 체크 해제 시 적용)</label>
                <select id="faceBase" onchange="generatePrompt()">
                    <option value="cheerful face with long straight brown hair and big dark brown eyes">긴 브라운 헤어 + 맑은 눈망울</option>
                    <option value="cheerful face with bright friendly eyes and neat short hair">밝고 친근한 단발 헤어</option>
                    <option value="wise scholar face with a gentle warm smile">온화한 지성인 인상</option>
                    <option value="handsome charismatic face with sharp jawline and sleek dark hair">샤프하고 카리스마 있는 인상</option>
                    <option value="Custom">직접 입력 (커스텀)</option>
                </select>
            </div>
            <div class="form-group" id="customFaceGroup" style="display:none;">
                <label>직접 입력 (영어)</label>
                <input type="text" id="customFace" placeholder="e.g. cute cat-eared character" oninput="generatePrompt()">
            </div>
        </div>

        <!-- 2. 복장 & 색상 (남/여 및 수영복 10가지 세분화) -->
        <div class="card">
            <h2>2. 복장 & 색상 설정</h2>
            <div class="form-group">
                <label>복장 스타일 (성별 반응형 10가지)</label>
                <select id="outfitCategory" onchange="handleOutfitChange()">
                    <!-- JS로 동적 채움 -->
                </select>
            </div>

            <div class="form-group">
                <label>의상 메인 컬러 (Main Outfit Color)</label>
                <select id="outfitColor" onchange="generatePrompt()">
                    <option value="dark navy and white">네이비 & 화이트 (Navy & White)</option>
                    <option value="sleek black and silver accents">블랙 & 실버 (Black & Silver)</option>
                    <option value="pure white and pastel blue">화이트 & 파스텔 블루</option>
                    <option value="crimson red and gold accents">크림슨 레드 & 골드</option>
                    <option value="emerald green and beige">에메랄드 그린 & 베이지</option>
                    <option value="soft pink and cream white">소프트 핑크 & 크림 화이트</option>
                    <option value="classic beige and brown tone">클래식 베이지 & 브라운</option>
                    <option value="vibrant neon cyan and magenta">네온 시안 & 마젠타</option>
                </select>
            </div>

            <div id="recommendNotice" class="recommend-badge">
                💡 추천 악세사리가 복장에 따라 자동 선택됩니다.
            </div>
        </div>

        <!-- 3. 악세사리 (체크박스 + 콤보박스 활성화 + 자동 추천) -->
        <div class="card">
            <h2>3. 외관 & 악세사리</h2>
            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:0.2rem;">체크박스 선택 시 관련 세부 옵션이 활성화됩니다.</p>
            
            <div class="acc-grid">
                <!-- 모자 -->
                <div class="acc-item">
                    <label><input type="checkbox" id="accHatChk" onchange="toggleAccSelect('accHat')"> 🧢 모자</label>
                    <select id="accHat" disabled onchange="generatePrompt()">
                        <option value="stylish beret">베레모 (Beret)</option>
                        <option value="trendy baseball cap">야구 모자 (Baseball Cap)</option>
                        <option value="cozy beanie">비니 (Beanie)</option>
                        <option value="classic fedora hat">페도라 (Fedora)</option>
                        <option value="sun bucket hat">버킷햇 (Bucket Hat)</option>
                    </select>
                </div>
                <!-- 안경 -->
                <div class="acc-item">
                    <label><input type="checkbox" id="accGlassesChk" onchange="toggleAccSelect('accGlasses')"> 👓 안경</label>
                    <select id="accGlasses" disabled onchange="generatePrompt()">
                        <option value="stylish round wire-rimmed glasses">동글이 금테 안경</option>
                        <option value="chic black thick-rimmed glasses">검은색 뿔테 안경</option>
                        <option value="trendy tinted sunglasses">선글라스 (Sunglasses)</option>
                        <option value="sleek futuristic visor glasses">고글/사이버 비저</option>
                    </select>
                </div>
                <!-- 넥타이 / 리본 -->
                <div class="acc-item">
                    <label><input type="checkbox" id="accTieChk" onchange="toggleAccSelect('accTie')"> 👔 넥타이</label>
                    <select id="accTie" disabled onchange="generatePrompt()">
                        <option value="green striped tie">초록 스트라이프 넥타이</option>
                        <option value="classic red necktie">클래식 레드 넥타이</option>
                        <option value="cute ribbon bowtie">귀여운 리본 타이</option>
                        <option value="sleek black slim tie">블랙 슬림 넥타이</option>
                    </select>
                </div>
                <!-- 귀걸이 -->
                <div class="acc-item">
                    <label><input type="checkbox" id="accEarringChk" onchange="toggleAccSelect('accEarring')"> 💎 귀걸이</label>
                    <select id="accEarring" disabled onchange="generatePrompt()">
                        <option value="subtle silver hoop earrings">실버 링 귀걸이</option>
                        <option value="sparkling diamond stud earrings">다이아몬드 스터드 귀걸이</option>
                        <option value="stylish dangling drop earrings">드롭 드렁크 귀걸이</option>
                    </select>
                </div>
                <!-- 목걸이 -->
                <div class="acc-item">
                    <label><input type="checkbox" id="accNecklaceChk" onchange="toggleAccSelect('accNecklace')"> 📿 목걸이</label>
                    <select id="accNecklace" disabled onchange="generatePrompt()">
                        <option value="delicate gold pendant necklace">골드 펜던트 목걸이</option>
                        <option value="chic black leather choker">블랙 가죽 초커</option>
                        <option value="layering chain necklace">레이어드 체인 목걸이</option>
                    </select>
                </div>
                <!-- 기타 (가방, 헤드폰 등) -->
                <div class="acc-item">
                    <label><input type="checkbox" id="accExtraChk" onchange="toggleAccSelect('accExtra')"> 🎧 소품</label>
                    <select id="accExtra" disabled onchange="generatePrompt()">
                        <option value="stylish over-ear wireless headphones">무선 헤드폰 (Headphones)</option>
                        <option value="leather backpack over one shoulder">가죽 백팩</option>
                        <option value="smart watch on wrist">스마트 워치</option>
                        <option value="beach straw tote bag">비치 짚가방</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 4. 표정 / 감정 & 포즈 (표정 8가지, 포즈 20가지) -->
        <div class="card">
            <h2>4. 표정 & 포즈 설정</h2>
            <div class="form-group">
                <label>기분 / 표정 (8가지 감정)</label>
                <select id="emotion" onchange="generatePrompt()">
                    <option value="cheerful bright smile with sparkling friendly eyes">😊 기쁨/밝은 미소 (Cheerful Smile)</option>
                    <option value="calm, serious, highly disciplined and focused expression">😐 차분함/진지함 (Calm & Serious)</option>
                    <option value="confident subtle smirk with playful charismatic gaze">지신감/자만 (Confident Smirk)</option>
                    <option value="shy embarrassed expression with slight blush on cheeks">😳 쑥스러움/홍조 (Shy Blush)</option>
                    <option value="curious wide-eyed surprised look with slightly open lips">😲 호기심/놀람 (Curious Surprised)</option>
                    <option value="pouting cute mischievous face with folded eyebrows">😜 장난기/뾰퉁함 (Mischievous Pout)</option>
                    <option value="gentle empathetic warm modest smile">🌿 온화함/다정함 (Gentle Warm Smile)</option>
                    <option value="cool, indifferent, cold distant look with sharp eyes">😎 쿨함/시크함 (Cool & Distant)</option>
                </select>
            </div>

            <div class="form-group">
                <label>포즈 (20가지 옵션)</label>
                <select id="pose" onchange="generatePrompt()">
                    <!-- 기본 / 정방향 포즈 -->
                    <option value="T-pose standing straight with arms outstretched horizontally">01. 정면 T-자세 (T-pose)</option>
                    <option value="perfect A-pose standing straight with arms angled downwards">02. 정면 A-자세 (A-pose)</option>
                    <option value="confident standing pose with hands on hips">03. 손 허리에 얹은 당당한 포즈</option>
                    <option value="friendly standing pose with one hand waving hello">04. 한 손으로 인사하는 포즈</option>
                    <option value="peace sign pose near eye with cheerful wink">05. V(피스) 포즈 & 윙크</option>
                    <!-- 액티브 / 걸어가는 포즈 -->
                    <option value="dynamic walking pose looking towards camera">06. 가볍게 걸어오는 포즈</option>
                    <option value="playful jumping pose in mid-air with joyful energy">07. 점프하는 활기찬 포즈</option>
                    <option value="arms crossed over chest with confident posture">08. 팔짱 끼고 서 있는 포즈</option>
                    <option value="one hand gently touching chin in thoughtful pose">09. 턱에 손을 얹고 생각하는 포즈</option>
                    <option value="pointing finger forward with energetic expression">10. 정면을 손가락으로 가리키는 포즈</option>
                    <!-- 앉은 자세 / 대기 포즈 -->
                    <option value="sitting comfortably on a chair leaning forward">11. 의자에 앉아 몸을 앞 기울인 포즈</option>
                    <option value="sitting thoughtfully at a desk with laptop">12. 책상 앞에 앉아 작업하는 포즈</option>
                    <option value="sitting on ground with knees hugged close">13. 무릎을 끌어안고 앉은 포즈</option>
                    <option value="leaning casually against a clean wall with one leg crossed">14. 벽에 툭 기대어 서 있는 포즈</option>
                    <option value="adjusting glasses with one finger in intelligent pose">15. 손가락으로 안경 올리는 포즈</option>
                    <!-- 특수 / 수영복 / 비치 / 액션 포즈 -->
                    <option value="sunbathing relaxation pose lying gently on beach towel">16. 선베드/타월에 누워 휴식하는 포즈</option>

        const emotion = document.getElementById('emotion').value;
        const pose = document.getElementById('pose').value;

        // 배경 처리
        let bgStr = document.getElementById('background').value;
        if (bgStr === 'Custom') {
            bgStr = document.getElementById('customBackground').value || 'clean studio background';
        }

        const cameraAngle = document.getElementById('cameraAngle').value;
        const lighting = document.getElementById('lighting').value;
        const quality = document.getElementById('quality').value;

        // 프롬프트 결합
        let finalPrompt = `${artStyle} of a ${gender} ${ageStr} character ${faceInstruction}. ` +
            `Wearing ${outfitStr}. ` +
            (accStr ? `${accStr} ` : '') +
            `Expression & Emotion: ${emotion}. ` +
            `Pose: ${pose}. ` +
            `Shot & Camera: ${cameraAngle}. ` +
            `Background: ${bgStr}. ` +
            `Lighting: ${lighting}. ` +
            `Quality & Specs: ${quality}.`;

        document.getElementById('promptResult').value = finalPrompt;
    }

    function copyPrompt() {
        const textarea = document.getElementById('promptResult');
        textarea.select();
        document.execCommand('copy');
        alert('영문 프롬프트가 클립보드에 복사되었습니다!');
    }

    window.onload = function() {
        handleGenderChange(); // 초기 복장 목록 세팅
        document.getElementById('mbtiDesc').innerText = mbtiMap[selectedMBTI].desc;
        generatePrompt();
    };
</script>

</body>
</html>
